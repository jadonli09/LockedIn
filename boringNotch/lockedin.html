<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked in</title>
<style>
  :root {
    --ink: #0A0812;
    --violet: #7C6CFF;
    --teal: #4ED8C3;
    --peach: #FFB38A;
    --rose: #E88CC4;
    --text: #F4F1FF;
    --progress: 0deg; /* driven by JS */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--ink);
    color: var(--text);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body.relock { animation: fadein 3s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* Aurora orb field — two soft drifting washes behind everything. */
  .orb {
    position: fixed;
    width: 65vmax;
    height: 65vmax;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.4;
    pointer-events: none;
  }
  .orb.a {
    top: -28vmax;
    left: -14vmax;
    background: radial-gradient(circle at 40% 40%, var(--violet), transparent 65%);
    animation: drift-a 16s ease-in-out infinite alternate;
  }
  .orb.b {
    bottom: -30vmax;
    right: -12vmax;
    background: radial-gradient(circle at 60% 60%, var(--teal), transparent 62%);
    animation: drift-b 19s ease-in-out infinite alternate;
  }
  .orb.c {
    top: 30vh;
    right: 4vw;
    width: 34vmax;
    height: 34vmax;
    opacity: 0.22;
    background: radial-gradient(circle at 50% 50%, var(--peach), transparent 60%);
    animation: drift-a 22s ease-in-out infinite alternate-reverse;
  }
  @keyframes drift-a {
    from { transform: translate(0, 0) scale(1); }
    to { transform: translate(5vmax, 3vmax) scale(1.12); }
  }
  @keyframes drift-b {
    from { transform: translate(0, 0) scale(1.08); }
    to { transform: translate(-4vmax, -3vmax) scale(1); }
  }

  .stack {
    position: relative;
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(244, 241, 255, 0.45);
    margin: 0 0 30px;
  }

  /* The session ring: aurora gradient fills as the session elapses. */
  .ring {
    position: relative;
    width: 240px;
    height: 240px;
    margin: 0 auto 38px;
  }
  .ring::before,
  .ring::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
  }
  /* Full aurora spectrum underneath… */
  .ring::before {
    background: conic-gradient(from -90deg,
      var(--violet), var(--teal), var(--peach), var(--rose), var(--violet));
  }
  /* …covered beyond the elapsed arc by a near-ink that doubles as the
     faint track ring. */
  .ring::after {
    background: conic-gradient(from -90deg,
      transparent var(--progress), #171325 var(--progress));
  }
  .ring .inner {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .time {
    font-size: 52px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .time-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(244, 241, 255, 0.4);
  }

  a.primary {
    display: inline-block;
    background: linear-gradient(100deg, var(--violet), var(--teal));
    color: rgba(10, 8, 18, 0.92);
    font-size: 15px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 6px 28px rgba(124, 108, 255, 0.35);
  }
  a.primary:active { transform: scale(0.97); }
  .quiet-row { margin-top: 24px; }
  a.pass {
    color: rgba(244, 241, 255, 0.32);
    font-size: 12px;
    text-decoration: none;
  }
  a.pass:hover { color: rgba(244, 241, 255, 0.55); }

  @media (prefers-reduced-motion: reduce) {
    .orb, .stack { animation: none; }
  }
</style>
</head>
<body>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>
<div class="stack">
  <p class="eyebrow" id="domain-label">Locked in</p>
  <div class="ring">
    <div class="inner">
      <div class="time" id="time">—</div>
      <div class="time-label">left</div>
    </div>
  </div>
  <a class="primary" href="lockedin://close">Stay locked in</a>
  <div class="quiet-row">
    <a class="pass" id="pass" href="#" hidden>2-min pass</a>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("relock") === "1") document.body.classList.add("relock");

  const domain = params.get("domain");
  if (domain) {
    document.getElementById("domain-label").textContent = domain;
    const pass = document.getElementById("pass");
    pass.hidden = false;
    pass.href = "lockedin://pass?domain=" + encodeURIComponent(domain)
      + "&back=" + encodeURIComponent(params.get("back") || ("https://" + domain));
  }

  // Live countdown + ring fill. `until` is the phase deadline (ms epoch);
  // `duration` is the phase length in seconds.
  const timeEl = document.getElementById("time");
  const until = parseInt(params.get("until") || "0", 10);
  const duration = parseInt(params.get("duration") || "0", 10);
  function render() {
    if (!until) {
      timeEl.textContent = "· ·";
      return;
    }
    const secs = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    const m = String(Math.floor(secs / 60)).padStart(2, "0");
    const s = String(secs % 60).padStart(2, "0");
    timeEl.textContent = `${m}:${s}`;
    if (duration > 0) {
      const elapsed = Math.min(1, Math.max(0, 1 - secs / duration));
      document.documentElement.style.setProperty("--progress", (elapsed * 360).toFixed(1) + "deg");
    }
    if (secs > 0) setTimeout(render, 1000 - (Date.now() % 1000));
  }
  render();
</script>
</body>
</html>
