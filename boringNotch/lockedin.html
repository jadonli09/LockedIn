<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked in</title>
<style>
  :root {
    --field: #0A0A0A;
    --notch: #000;
    --accent: #E8A87C; /* overridden by ?accent= */
    --text: #FFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--field);
    color: var(--text);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", sans-serif;
    overflow: hidden;
  }
  body.relock { animation: fadein 3s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* The signature: the island itself, at the top of the page where it lives,
     with the minutes numeral tucked at its right edge — same as the notch. */
  .island-row {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
  }
  .island {
    width: 196px;
    height: 34px;
    background: var(--notch);
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-top: none;
  }
  .island-minutes {
    position: absolute;
    right: -30px;
    top: 0;
    height: 34px;
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .stack {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    text-align: center;
    animation: settle 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    margin: 0;
  }

  .time {
    font-size: 96px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    margin: 0;
  }

  /* One dot per minute of the phase; attended minutes fill in accent. */
  .dots {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .dots .row {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
  }
  .dot.attended { background: var(--accent); }
  .attended-line {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.35);
  }

  a.primary {
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    color: rgba(0, 0, 0, 0.85);
    font-size: 15px;
    font-weight: 500;
    padding: 11px 26px;
    border-radius: 999px;
    text-decoration: none;
    margin-top: 8px;
  }
  a.primary:active { transform: scale(0.97); }
  /* The 2-minute pass: a liquid-glass capsule that runs from the cursor.
     Position is driven by JS; the transition is the spring-ish hop. */
  .pass-arena {
    position: relative;
    width: min(760px, 94vw);
    height: 76px;
  }
  a.pass {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px)));
    will-change: transform;
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04)),
      rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.18),
      0 4px 10px rgba(0,0,0,0.35);
    white-space: nowrap;
    user-select: none;
  }


  @media (prefers-reduced-motion: reduce) {
    .stack { animation: none; }
  }
</style>
</head>
<body>
<div class="island-row">
  <div class="island"></div>
  <div class="island-minutes" id="island-minutes"></div>
</div>
<div class="stack">
  <p class="eyebrow" id="domain-label">Locked in</p>
  <p class="time" id="time">—</p>
  <div class="dots">
    <div id="dot-rows"></div>
    <div class="attended-line" id="attended-line"></div>
  </div>
  <a class="primary" href="lockedin://close">Stay locked in</a>
  <div class="pass-arena" id="pass-arena" hidden>
    <a class="pass" id="pass" href="#">2-min pass</a>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("relock") === "1") document.body.classList.add("relock");

  const accent = params.get("accent");
  if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
    document.documentElement.style.setProperty("--accent", accent);
  }

  // Thread the browser's identity through both actions, so the app knows
  // which browser to command even when it isn't frontmost.
  const browser = params.get("b") || "";
  document.querySelector("a.primary").href =
    "lockedin://close?b=" + encodeURIComponent(browser);

  const domain = params.get("domain");
  if (domain) {
    document.getElementById("domain-label").textContent = domain;
    document.getElementById("pass-arena").hidden = false;
    const pass = document.getElementById("pass");
    pass.href = "lockedin://pass?domain=" + encodeURIComponent(domain)
      + "&back=" + encodeURIComponent(params.get("back") || ("https://" + domain))
      + "&b=" + encodeURIComponent(browser);
  }

  // Runaway pass, continuous physics: the button is a damped particle
  // pushed away by an inverse-distance field around the cursor (harder the
  // closer you get — the speed adapts to how hard you chase), pulled home
  // by a soft spring, and integrated every frame. No hops, no jitter.
  (function () {
    const arena = document.getElementById("pass-arena");
    const pass = document.getElementById("pass");
    const RADIUS = 240;         // repulsion field radius
    const PUSH = 16000;          // repulsion strength (px/s² at 1px)
    const SPRING = 5.5;         // pull toward home
    const DAMPING = 0.90;       // per-frame velocity retention
    const MAX_SPEED = 1800;      // px/s cap
    let x = 0, y = 0, vx = 0, vy = 0;
    let cursor = null, last = performance.now();

    document.addEventListener("mousemove", e => { cursor = { x: e.clientX, y: e.clientY }; });
    document.addEventListener("mouseleave", () => { cursor = null; });

    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (!arena.hidden) {
        const r = pass.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        let ax = -SPRING * x * 6, ay = -SPRING * y * 6;   // spring home
        if (cursor) {
          const dx = cx - cursor.x, dy = cy - cursor.y;
          const d = Math.hypot(dx, dy);
          if (d < RADIUS && d > 0.5) {
            // Inverse-distance push, ramping to zero at the field edge.
            const falloff = 1 - d / RADIUS;
            const f = PUSH * (falloff + 0.35 * falloff * falloff) / Math.max(d, 26);
            let ux = dx / d, uy = dy / d;
            // Curve around the cursor: blend a tangential component in as it
            // nears a side wall so it circles back toward the open center
            // instead of getting pinned. Tangent direction points toward home.
            const bxNow = arena.clientWidth / 2 - r.width / 2 - 4;
            const nearWall = Math.max(0, Math.min(1, (Math.abs(x) - (bxNow - 200)) / 200));
            if (nearWall > 0) {
              // Perpendicular to the flee vector, choosing the sign that heads home.
              let tx = -uy, ty = ux;
              if (tx * (-x) + ty * (-y) < 0) { tx = -tx; ty = -ty; }
              const k = nearWall * 2.2;
              ux = ux + tx * k; uy = uy + ty * k;
              const n = Math.hypot(ux, uy) || 1; ux /= n; uy /= n;
            }
            ax += ux * f * 60;
            ay += uy * f * 60 * 0.75;
          }
        }
        vx = (vx + ax * dt) * DAMPING;
        vy = (vy + ay * dt) * DAMPING;
        const sp = Math.hypot(vx, vy);
        if (sp > MAX_SPEED) { vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
        x += vx * dt; y += vy * dt;
        // Soft walls: keep it inside the arena.
        const bx = arena.clientWidth / 2 - r.width / 2 - 4, by = 26;
        if (x > bx) { x = bx; vx = -Math.abs(vx) * 0.4; }
        if (x < -bx) { x = -bx; vx = Math.abs(vx) * 0.4; }
        if (y > by) { y = by; vy = -Math.abs(vy) * 0.4; }
        if (y < -by) { y = -by; vy = Math.abs(vy) * 0.4; }
        pass.style.setProperty("--dx", x.toFixed(2) + "px");
        pass.style.setProperty("--dy", y.toFixed(2) + "px");
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  // Live countdown + attended-minute dots. `until` is the phase deadline
  // (ms epoch); `duration` is the phase length in seconds.
  const timeEl = document.getElementById("time");
  const until = parseInt(params.get("until") || "0", 10);
  const duration = parseInt(params.get("duration") || "0", 10);
  const totalMinutes = Math.max(1, Math.round(duration / 60));

  const rowsEl = document.getElementById("dot-rows");
  rowsEl.className = "";
  const dots = [];
  for (let start = 0; start < totalMinutes; start += 30) {
    const row = document.createElement("div");
    row.className = "row";
    if (start > 0) row.style.marginTop = "8px";
    for (let m = start; m < Math.min(start + 30, totalMinutes); m++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      row.appendChild(dot);
      dots.push(dot);
    }
    rowsEl.appendChild(row);
  }

  function render() {
    if (!until) {
      timeEl.textContent = "· ·";
      return;
    }
    const secs = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    const m = String(Math.floor(secs / 60)).padStart(2, "0");
    const s = String(secs % 60).padStart(2, "0");
    timeEl.textContent = `${m}:${s}`;
    document.getElementById("island-minutes").textContent = Math.ceil(secs / 60);

    if (duration > 0) {
      const attended = Math.min(totalMinutes, Math.floor(((duration - secs) / duration) * totalMinutes));
      dots.forEach((dot, i) => dot.classList.toggle("attended", i < attended));
      document.getElementById("attended-line").textContent =
        `${attended} OF ${totalMinutes} MINUTES ATTENDED`;
    }
    if (secs > 0) setTimeout(render, 1000 - (Date.now() % 1000));
  }
  render();
</script>
</body>
</html>
