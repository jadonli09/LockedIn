<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Locked in</title>
<style>
  :root {
    --field: #0A0A0A;
    --notch: #000;
    --accent: #E8A87C; /* overridden by ?accent= */
    --text: #FFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--field);
    color: var(--text);
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", sans-serif;
    overflow: hidden;
  }
  body.relock { animation: fadein 3s ease-out; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* The signature: the island itself, at the top of the page where it lives,
     with the minutes numeral tucked at its right edge — same as the notch. */
  .island-row {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
  }
  .island {
    width: 196px;
    height: 34px;
    background: var(--notch);
    border-bottom-left-radius: 14px;
    border-bottom-right-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-top: none;
  }
  .island-minutes {
    position: absolute;
    right: -30px;
    top: 0;
    height: 34px;
    display: flex;
    align-items: center;
    font-size: 11px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .stack {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    text-align: center;
    animation: settle 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  .eyebrow {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.4);
    margin: 0;
  }

  .time {
    font-size: 96px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    margin: 0;
  }

  /* One dot per minute of the phase; attended minutes fill in accent. */
  .dots {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
  }
  .dots .row {
    display: flex;
    gap: 8px;
  }
  .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.14);
  }
  .dot.attended { background: var(--accent); }
  .attended-line {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.35);
  }

  a.primary {
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    color: rgba(0, 0, 0, 0.85);
    font-size: 15px;
    font-weight: 500;
    padding: 11px 26px;
    border-radius: 999px;
    text-decoration: none;
    margin-top: 8px;
  }
  a.primary:active { transform: scale(0.97); }
  /* The 2-minute pass: a liquid-glass capsule that runs from the cursor.
     Position is driven by JS; the transition is the spring-ish hop. */
  .pass-arena {
    position: relative;
    width: min(560px, 90vw);
    height: 48px;
  }
  a.pass {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, 0px)));
    transition: transform 0.18s cubic-bezier(0.34, 1.3, 0.64, 1);
    color: rgba(255, 255, 255, 0.85);
    font-size: 12px;
    font-weight: 500;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04)),
      rgba(255,255,255,0.06);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
            backdrop-filter: blur(14px) saturate(1.4);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.18),
      0 4px 10px rgba(0,0,0,0.35);
    white-space: nowrap;
    user-select: none;
  }
  a.pass.home { transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1); }

  @media (prefers-reduced-motion: reduce) {
    .stack { animation: none; }
  }
</style>
</head>
<body>
<div class="island-row">
  <div class="island"></div>
  <div class="island-minutes" id="island-minutes"></div>
</div>
<div class="stack">
  <p class="eyebrow" id="domain-label">Locked in</p>
  <p class="time" id="time">—</p>
  <div class="dots">
    <div id="dot-rows"></div>
    <div class="attended-line" id="attended-line"></div>
  </div>
  <a class="primary" href="lockedin://close">Stay locked in</a>
  <div class="pass-arena" id="pass-arena" hidden>
    <a class="pass" id="pass" href="#">2-min pass</a>
  </div>
</div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("relock") === "1") document.body.classList.add("relock");

  const accent = params.get("accent");
  if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
    document.documentElement.style.setProperty("--accent", accent);
  }

  // Thread the browser's identity through both actions, so the app knows
  // which browser to command even when it isn't frontmost.
  const browser = params.get("b") || "";
  document.querySelector("a.primary").href =
    "lockedin://close?b=" + encodeURIComponent(browser);

  const domain = params.get("domain");
  if (domain) {
    document.getElementById("domain-label").textContent = domain;
    document.getElementById("pass-arena").hidden = false;
    const pass = document.getElementById("pass");
    pass.href = "lockedin://pass?domain=" + encodeURIComponent(domain)
      + "&back=" + encodeURIComponent(params.get("back") || ("https://" + domain))
      + "&b=" + encodeURIComponent(browser);
  }

  // Runaway pass: hop away along the cursor→button vector when the cursor
  // gets close; ease home once it backs off.
  (function () {
    const arena = document.getElementById("pass-arena");
    const pass = document.getElementById("pass");
    const TRIGGER = 140, HOP = 190;
    let dx = 0, dy = 0;
    function apply(home) {
      pass.classList.toggle("home", home);
      pass.style.setProperty("--dx", dx + "px");
      pass.style.setProperty("--dy", dy + "px");
    }
    document.addEventListener("mousemove", (e) => {
      if (arena.hidden) return;
      const r = pass.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const vx = cx - e.clientX, vy = cy - e.clientY;
      const dist = Math.max(1, Math.hypot(vx, vy));
      if (dist < TRIGGER) {
        const ux = vx / dist, uy = vy / dist;
        const jitter = (Math.random() - 0.5) * 0.7;
        const bound = Math.min(220, arena.clientWidth / 2 - 60);
        let nx = dx + (ux - uy * jitter) * HOP;
        let ny = dy + (uy + ux * jitter) * HOP * 0.6;
        if (Math.abs(nx) > bound) nx = -nx * 0.5;
        if (Math.abs(ny) > 60) ny = -ny * 0.5;
        dx = nx; dy = ny;
        apply(false);
      } else if (dist > TRIGGER * 2.2 && (dx || dy)) {
        dx = 0; dy = 0;
        apply(true);
      }
    });
    document.addEventListener("mouseleave", () => { dx = 0; dy = 0; apply(true); });
  })();

  // Live countdown + attended-minute dots. `until` is the phase deadline
  // (ms epoch); `duration` is the phase length in seconds.
  const timeEl = document.getElementById("time");
  const until = parseInt(params.get("until") || "0", 10);
  const duration = parseInt(params.get("duration") || "0", 10);
  const totalMinutes = Math.max(1, Math.round(duration / 60));

  const rowsEl = document.getElementById("dot-rows");
  rowsEl.className = "";
  const dots = [];
  for (let start = 0; start < totalMinutes; start += 30) {
    const row = document.createElement("div");
    row.className = "row";
    if (start > 0) row.style.marginTop = "8px";
    for (let m = start; m < Math.min(start + 30, totalMinutes); m++) {
      const dot = document.createElement("div");
      dot.className = "dot";
      row.appendChild(dot);
      dots.push(dot);
    }
    rowsEl.appendChild(row);
  }

  function render() {
    if (!until) {
      timeEl.textContent = "· ·";
      return;
    }
    const secs = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    const m = String(Math.floor(secs / 60)).padStart(2, "0");
    const s = String(secs % 60).padStart(2, "0");
    timeEl.textContent = `${m}:${s}`;
    document.getElementById("island-minutes").textContent = Math.ceil(secs / 60);

    if (duration > 0) {
      const attended = Math.min(totalMinutes, Math.floor(((duration - secs) / duration) * totalMinutes));
      dots.forEach((dot, i) => dot.classList.toggle("attended", i < attended));
      document.getElementById("attended-line").textContent =
        `${attended} OF ${totalMinutes} MINUTES ATTENDED`;
    }
    if (secs > 0) setTimeout(render, 1000 - (Date.now() % 1000));
  }
  render();
</script>
</body>
</html>
